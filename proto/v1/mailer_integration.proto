syntax = "proto3";

package mailer;

option go_package = "mailer-mcp-component/gen/proto/v1";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Enums
// ============================================================================

enum ProviderType {
  PROVIDER_TYPE_UNSPECIFIED = 0;
  PROVIDER_TYPE_GMAIL = 1;
  PROVIDER_TYPE_OUTLOOK = 2;
  PROVIDER_TYPE_YAHOO = 3;
  PROVIDER_TYPE_IMAP = 4;
  PROVIDER_TYPE_SMTP = 5;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_ACTIVE = 1;
  CONNECTION_STATUS_SUSPENDED = 2;
  CONNECTION_STATUS_REVOKED = 3;
  CONNECTION_STATUS_ERROR = 4;
}

enum SyncStatus {
  SYNC_STATUS_UNSPECIFIED = 0;
  SYNC_STATUS_PENDING = 1;
  SYNC_STATUS_IN_PROGRESS = 2;
  SYNC_STATUS_COMPLETED = 3;
  SYNC_STATUS_FAILED = 4;
}

enum MessageFolder {
  MESSAGE_FOLDER_UNSPECIFIED = 0;
  MESSAGE_FOLDER_INBOX = 1;
  MESSAGE_FOLDER_SENT = 2;
  MESSAGE_FOLDER_DRAFTS = 3;
  MESSAGE_FOLDER_TRASH = 4;
  MESSAGE_FOLDER_SPAM = 5;
  MESSAGE_FOLDER_ARCHIVE = 6;
}

enum CalendarEventStatus {
  CALENDAR_EVENT_STATUS_UNSPECIFIED = 0;
  CALENDAR_EVENT_STATUS_CONFIRMED = 1;
  CALENDAR_EVENT_STATUS_TENTATIVE = 2;
  CALENDAR_EVENT_STATUS_CANCELLED = 3;
}

// ============================================================================
// Core Types
// ============================================================================

message EmailConnection {
  string id = 1;
  string user_id = 2;
  ProviderType provider = 3;
  string email_address = 4;
  ConnectionStatus status = 5;
  bool sync_enabled = 6;
  google.protobuf.Timestamp last_synced_at = 7;
  google.protobuf.Timestamp connected_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string error_message = 10;
}

message SyncedMessage {
  string id = 1;
  string connection_id = 2;
  string provider_message_id = 3;
  string from_address = 4;
  string from_name = 5;
  repeated string to_addresses = 6;
  repeated string cc_addresses = 7;
  string subject = 8;
  string body_text = 9;
  string body_html = 10;
  MessageFolder folder = 11;
  bool is_read = 12;
  bool is_starred = 13;
  bool has_attachments = 14;
  string thread_id = 15;
  repeated string labels = 16;
  google.protobuf.Timestamp sent_at = 17;
  google.protobuf.Timestamp received_at = 18;
  google.protobuf.Timestamp synced_at = 19;
}

message SyncedContact {
  string id = 1;
  string connection_id = 2;
  string provider_contact_id = 3;
  string email = 4;
  string display_name = 5;
  string first_name = 6;
  string last_name = 7;
  string phone_number = 8;
  string company = 9;
  string job_title = 10;
  string avatar_url = 11;
  google.protobuf.Timestamp synced_at = 12;
}

message CalendarEvent {
  string id = 1;
  string connection_id = 2;
  string provider_event_id = 3;
  string title = 4;
  string description = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  string location = 8;
  bool is_all_day = 9;
  repeated string attendee_emails = 10;
  string organizer_email = 11;
  CalendarEventStatus status = 12;
  string recurrence_rule = 13;
  string calendar_id = 14;
  google.protobuf.Timestamp synced_at = 15;
}

message SyncHistory {
  string id = 1;
  string connection_id = 2;
  string sync_type = 3;
  SyncStatus status = 4;
  int32 items_synced = 5;
  int32 items_failed = 6;
  string error_message = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
}

// ============================================================================
// Connection RPCs - Request/Response Messages
// ============================================================================

message ConnectProviderRequest {
  ProviderType provider = 1;
  string auth_code = 2;
  string redirect_uri = 3;
  string user_id = 4;
}

message ConnectProviderResponse {
  EmailConnection connection = 1;
}

message DisconnectProviderRequest {
  string connection_id = 1;
}

message DisconnectProviderResponse {}

message GetConnectionRequest {
  string connection_id = 1;
}

message GetConnectionResponse {
  EmailConnection connection = 1;
}

message ListConnectionsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListConnectionsResponse {
  repeated EmailConnection connections = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message RefreshTokenRequest {
  string connection_id = 1;
}

message RefreshTokenResponse {
  EmailConnection connection = 1;
}

message UpdateSyncEnabledRequest {
  string connection_id = 1;
  bool sync_enabled = 2;
}

message UpdateSyncEnabledResponse {
  EmailConnection connection = 1;
}

message SuspendConnectionRequest {
  string connection_id = 1;
  string reason = 2;
}

message SuspendConnectionResponse {
  EmailConnection connection = 1;
}

message RevokeConnectionRequest {
  string connection_id = 1;
}

message RevokeConnectionResponse {}

// ============================================================================
// Message Sync RPCs - Request/Response Messages
// ============================================================================

message SyncMessagesRequest {
  string connection_id = 1;
  MessageFolder folder = 2;
  google.protobuf.Timestamp since = 3;
}

message SyncMessagesResponse {
  int32 messages_synced = 1;
  int32 messages_failed = 2;
  google.protobuf.Timestamp sync_completed_at = 3;
}

message GetSyncedMessageRequest {
  string id = 1;
}

message GetSyncedMessageResponse {
  SyncedMessage message = 1;
}

message ListSyncedMessagesRequest {
  string connection_id = 1;
  MessageFolder folder = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSyncedMessagesResponse {
  repeated SyncedMessage messages = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchMessagesRequest {
  string connection_id = 1;
  string query = 2;
  MessageFolder folder = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message SearchMessagesResponse {
  repeated SyncedMessage messages = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SendViaProviderRequest {
  string connection_id = 1;
  repeated string to_addresses = 2;
  repeated string cc_addresses = 3;
  repeated string bcc_addresses = 4;
  string subject = 5;
  string body_text = 6;
  string body_html = 7;
  string in_reply_to_provider_id = 8;
}

message SendViaProviderResponse {
  SyncedMessage message = 1;
}

message UpdateMessageStatusRequest {
  string id = 1;
  bool is_read = 2;
  bool is_starred = 3;
  repeated string labels = 4;
}

message UpdateMessageStatusResponse {
  SyncedMessage message = 1;
}

message MoveMessageRequest {
  string id = 1;
  MessageFolder destination_folder = 2;
}

message MoveMessageResponse {
  SyncedMessage message = 1;
}

message DeleteMessageRequest {
  string id = 1;
  bool permanent = 2;
}

message DeleteMessageResponse {}

// ============================================================================
// Contact Sync RPCs - Request/Response Messages
// ============================================================================

message SyncContactsRequest {
  string connection_id = 1;
}

message SyncContactsResponse {
  int32 contacts_synced = 1;
  int32 contacts_failed = 2;
  google.protobuf.Timestamp sync_completed_at = 3;
}

message GetSyncedContactRequest {
  string id = 1;
}

message GetSyncedContactResponse {
  SyncedContact contact = 1;
}

message ListSyncedContactsRequest {
  string connection_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSyncedContactsResponse {
  repeated SyncedContact contacts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SearchContactsRequest {
  string connection_id = 1;
  string query = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message SearchContactsResponse {
  repeated SyncedContact contacts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ============================================================================
// Calendar Sync RPCs - Request/Response Messages
// ============================================================================

message SyncCalendarEventsRequest {
  string connection_id = 1;
  string calendar_id = 2;
  google.protobuf.Timestamp since = 3;
}

message SyncCalendarEventsResponse {
  int32 events_synced = 1;
  int32 events_failed = 2;
  google.protobuf.Timestamp sync_completed_at = 3;
}

message GetCalendarEventRequest {
  string id = 1;
}

message GetCalendarEventResponse {
  CalendarEvent event = 1;
}

message ListCalendarEventsRequest {
  string connection_id = 1;
  string calendar_id = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListCalendarEventsResponse {
  repeated CalendarEvent events = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CreateCalendarEventRequest {
  string connection_id = 1;
  string calendar_id = 2;
  string title = 3;
  string description = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  string location = 7;
  bool is_all_day = 8;
  repeated string attendee_emails = 9;
  string recurrence_rule = 10;
}

message CreateCalendarEventResponse {
  CalendarEvent event = 1;
}

message UpdateCalendarEventRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp start_time = 4;
  google.protobuf.Timestamp end_time = 5;
  string location = 6;
  bool is_all_day = 7;
  repeated string attendee_emails = 8;
  string recurrence_rule = 9;
  CalendarEventStatus status = 10;
}

message UpdateCalendarEventResponse {
  CalendarEvent event = 1;
}

message DeleteCalendarEventRequest {
  string id = 1;
}

message DeleteCalendarEventResponse {}

// ============================================================================
// Sync History RPCs
// ============================================================================

message ListSyncHistoryRequest {
  string connection_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSyncHistoryResponse {
  repeated SyncHistory entries = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ============================================================================
// Service
// ============================================================================

service EmailIntegrationService {
  // Connection RPCs
  rpc ConnectProvider(ConnectProviderRequest) returns (ConnectProviderResponse);
  rpc DisconnectProvider(DisconnectProviderRequest) returns (DisconnectProviderResponse);
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc UpdateSyncEnabled(UpdateSyncEnabledRequest) returns (UpdateSyncEnabledResponse);
  rpc SuspendConnection(SuspendConnectionRequest) returns (SuspendConnectionResponse);
  rpc RevokeConnection(RevokeConnectionRequest) returns (RevokeConnectionResponse);

  // Message Sync RPCs
  rpc SyncMessages(SyncMessagesRequest) returns (SyncMessagesResponse);
  rpc GetSyncedMessage(GetSyncedMessageRequest) returns (GetSyncedMessageResponse);
  rpc ListSyncedMessages(ListSyncedMessagesRequest) returns (ListSyncedMessagesResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc SendViaProvider(SendViaProviderRequest) returns (SendViaProviderResponse);
  rpc UpdateMessageStatus(UpdateMessageStatusRequest) returns (UpdateMessageStatusResponse);
  rpc MoveMessage(MoveMessageRequest) returns (MoveMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);

  // Contact Sync RPCs
  rpc SyncContacts(SyncContactsRequest) returns (SyncContactsResponse);
  rpc GetSyncedContact(GetSyncedContactRequest) returns (GetSyncedContactResponse);
  rpc ListSyncedContacts(ListSyncedContactsRequest) returns (ListSyncedContactsResponse);
  rpc SearchContacts(SearchContactsRequest) returns (SearchContactsResponse);

  // Calendar Sync RPCs
  rpc SyncCalendarEvents(SyncCalendarEventsRequest) returns (SyncCalendarEventsResponse);
  rpc GetCalendarEvent(GetCalendarEventRequest) returns (GetCalendarEventResponse);
  rpc ListCalendarEvents(ListCalendarEventsRequest) returns (ListCalendarEventsResponse);
  rpc CreateCalendarEvent(CreateCalendarEventRequest) returns (CreateCalendarEventResponse);
  rpc UpdateCalendarEvent(UpdateCalendarEventRequest) returns (UpdateCalendarEventResponse);
  rpc DeleteCalendarEvent(DeleteCalendarEventRequest) returns (DeleteCalendarEventResponse);

  // Sync History
  rpc ListSyncHistory(ListSyncHistoryRequest) returns (ListSyncHistoryResponse);
}
