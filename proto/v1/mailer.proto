syntax = "proto3";

package mailer;

option go_package = "mailer-mcp-component/gen/proto/v1";

import "google/protobuf/timestamp.proto";

// ============================================================================
// Enums
// ============================================================================

enum EmailStatusType {
  EMAIL_STATUS_TYPE_UNSPECIFIED = 0;
  EMAIL_STATUS_TYPE_QUEUED = 1;
  EMAIL_STATUS_TYPE_SENDING = 2;
  EMAIL_STATUS_TYPE_SENT = 3;
  EMAIL_STATUS_TYPE_DELIVERED = 4;
  EMAIL_STATUS_TYPE_BOUNCED = 5;
  EMAIL_STATUS_TYPE_FAILED = 6;
}

// ============================================================================
// Core Types
// ============================================================================

message EmailAddress {
  string email = 1;
  string name = 2;
}

message EmailAttachment {
  string filename = 1;
  string content_type = 2;
  bytes content = 3;
  int64 size_bytes = 4;
}

message Email {
  string id = 1;
  EmailAddress from = 2;
  repeated EmailAddress to = 3;
  repeated EmailAddress cc = 4;
  repeated EmailAddress bcc = 5;
  string subject = 6;
  string body_text = 7;
  string body_html = 8;
  repeated EmailAttachment attachments = 9;
  string in_reply_to = 10;
  string thread_id = 11;
  map<string, string> headers = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp sent_at = 14;
}

message EmailDraft {
  string id = 1;
  EmailAddress from = 2;
  repeated EmailAddress to = 3;
  repeated EmailAddress cc = 4;
  repeated EmailAddress bcc = 5;
  string subject = 6;
  string body_text = 7;
  string body_html = 8;
  repeated EmailAttachment attachments = 9;
  string in_reply_to = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message EmailTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
  string subject_template = 4;
  string body_text_template = 5;
  string body_html_template = 6;
  repeated string variable_names = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message EmailStatus {
  string id = 1;
  string email_id = 2;
  EmailStatusType status = 3;
  string error_message = 4;
  int32 attempt_count = 5;
  google.protobuf.Timestamp last_attempt_at = 6;
  google.protobuf.Timestamp delivered_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message AliasAddress {
  string id = 1;
  string address = 2;
  string display_name = 3;
  string owner_user_id = 4;
  bool is_active = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp deactivated_at = 7;
}

message ReceivedEmail {
  string id = 1;
  EmailAddress from = 2;
  repeated EmailAddress to = 3;
  repeated EmailAddress cc = 4;
  string subject = 5;
  string body_text = 6;
  string body_html = 7;
  repeated EmailAttachment attachments = 8;
  string thread_id = 9;
  bool is_read = 10;
  google.protobuf.Timestamp received_at = 11;
}

// ============================================================================
// Send Email RPCs
// ============================================================================

message SendEmailRequest {
  EmailAddress from = 1;
  repeated EmailAddress to = 2;
  repeated EmailAddress cc = 3;
  repeated EmailAddress bcc = 4;
  string subject = 5;
  string body_text = 6;
  string body_html = 7;
  repeated EmailAttachment attachments = 8;
  string in_reply_to = 9;
  map<string, string> headers = 10;
}

message SendEmailResponse {
  Email email = 1;
}

message SendBatchEmailRequest {
  repeated SendEmailRequest emails = 1;
}

message SendBatchEmailResponse {
  repeated Email emails = 1;
  int32 success_count = 2;
  int32 failure_count = 3;
}

message GetEmailRequest {
  string id = 1;
}

message GetEmailResponse {
  Email email = 1;
}

message ListEmailsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string thread_id = 3;
}

message ListEmailsResponse {
  repeated Email emails = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ============================================================================
// Draft RPCs
// ============================================================================

message CreateDraftRequest {
  EmailAddress from = 1;
  repeated EmailAddress to = 2;
  repeated EmailAddress cc = 3;
  repeated EmailAddress bcc = 4;
  string subject = 5;
  string body_text = 6;
  string body_html = 7;
  repeated EmailAttachment attachments = 8;
  string in_reply_to = 9;
}

message CreateDraftResponse {
  EmailDraft draft = 1;
}

message GetDraftRequest {
  string id = 1;
}

message GetDraftResponse {
  EmailDraft draft = 1;
}

message UpdateDraftRequest {
  string id = 1;
  repeated EmailAddress to = 2;
  repeated EmailAddress cc = 3;
  repeated EmailAddress bcc = 4;
  string subject = 5;
  string body_text = 6;
  string body_html = 7;
  repeated EmailAttachment attachments = 8;
}

message UpdateDraftResponse {
  EmailDraft draft = 1;
}

message DeleteDraftRequest {
  string id = 1;
}

message DeleteDraftResponse {}

message ListDraftsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListDraftsResponse {
  repeated EmailDraft drafts = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message SendDraftRequest {
  string id = 1;
}

message SendDraftResponse {
  Email email = 1;
}

// ============================================================================
// Template RPCs
// ============================================================================

message CreateEmailTemplateRequest {
  string name = 1;
  string description = 2;
  string subject_template = 3;
  string body_text_template = 4;
  string body_html_template = 5;
  repeated string variable_names = 6;
}

message CreateEmailTemplateResponse {
  EmailTemplate template = 1;
}

message GetEmailTemplateRequest {
  string id = 1;
}

message GetEmailTemplateResponse {
  EmailTemplate template = 1;
}

message ListEmailTemplatesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListEmailTemplatesResponse {
  repeated EmailTemplate templates = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateEmailTemplateRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string subject_template = 4;
  string body_text_template = 5;
  string body_html_template = 6;
  repeated string variable_names = 7;
}

message UpdateEmailTemplateResponse {
  EmailTemplate template = 1;
}

message DeleteEmailTemplateRequest {
  string id = 1;
}

message DeleteEmailTemplateResponse {}

// ============================================================================
// Email Status RPCs
// ============================================================================

message GetEmailStatusRequest {
  string email_id = 1;
}

message GetEmailStatusResponse {
  EmailStatus status = 1;
}

message ListEmailStatusesRequest {
  int32 page_size = 1;
  string page_token = 2;
  EmailStatusType status_filter = 3;
}

message ListEmailStatusesResponse {
  repeated EmailStatus statuses = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ============================================================================
// Alias Address RPCs
// ============================================================================

message CreateAliasAddressRequest {
  string address = 1;
  string display_name = 2;
  string owner_user_id = 3;
}

message CreateAliasAddressResponse {
  AliasAddress alias_address = 1;
}

message GetAliasAddressRequest {
  string id = 1;
}

message GetAliasAddressResponse {
  AliasAddress alias_address = 1;
}

message ListAliasAddressesRequest {
  string owner_user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListAliasAddressesResponse {
  repeated AliasAddress alias_addresses = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message DeactivateAliasAddressRequest {
  string id = 1;
}

message DeactivateAliasAddressResponse {
  AliasAddress alias_address = 1;
}

message DeleteAliasAddressRequest {
  string id = 1;
}

message DeleteAliasAddressResponse {}

// ============================================================================
// Received Emails RPCs
// ============================================================================

message ListReceivedEmailsRequest {
  string alias_address_id = 1;
  int32 page_size = 2;
  string page_token = 3;
  bool unread_only = 4;
}

message ListReceivedEmailsResponse {
  repeated ReceivedEmail emails = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ============================================================================
// Service
// ============================================================================

service MailerService {
  // Send Email RPCs
  rpc SendEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc SendBatchEmail(SendBatchEmailRequest) returns (SendBatchEmailResponse);
  rpc GetEmail(GetEmailRequest) returns (GetEmailResponse);
  rpc ListEmails(ListEmailsRequest) returns (ListEmailsResponse);

  // Draft RPCs
  rpc CreateDraft(CreateDraftRequest) returns (CreateDraftResponse);
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  rpc UpdateDraft(UpdateDraftRequest) returns (UpdateDraftResponse);
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse);
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  rpc SendDraft(SendDraftRequest) returns (SendDraftResponse);

  // Template RPCs
  rpc CreateEmailTemplate(CreateEmailTemplateRequest) returns (CreateEmailTemplateResponse);
  rpc GetEmailTemplate(GetEmailTemplateRequest) returns (GetEmailTemplateResponse);
  rpc ListEmailTemplates(ListEmailTemplatesRequest) returns (ListEmailTemplatesResponse);
  rpc UpdateEmailTemplate(UpdateEmailTemplateRequest) returns (UpdateEmailTemplateResponse);
  rpc DeleteEmailTemplate(DeleteEmailTemplateRequest) returns (DeleteEmailTemplateResponse);

  // Email Status RPCs
  rpc GetEmailStatus(GetEmailStatusRequest) returns (GetEmailStatusResponse);
  rpc ListEmailStatuses(ListEmailStatusesRequest) returns (ListEmailStatusesResponse);

  // Alias Address RPCs
  rpc CreateAliasAddress(CreateAliasAddressRequest) returns (CreateAliasAddressResponse);
  rpc GetAliasAddress(GetAliasAddressRequest) returns (GetAliasAddressResponse);
  rpc ListAliasAddresses(ListAliasAddressesRequest) returns (ListAliasAddressesResponse);
  rpc DeactivateAliasAddress(DeactivateAliasAddressRequest) returns (DeactivateAliasAddressResponse);
  rpc DeleteAliasAddress(DeleteAliasAddressRequest) returns (DeleteAliasAddressResponse);

  // Received Emails
  rpc ListReceivedEmails(ListReceivedEmailsRequest) returns (ListReceivedEmailsResponse);
}
